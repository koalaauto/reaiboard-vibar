# What each input on the keyboard does. A saved change applies within about a second.
# You rarely need to edit this by hand, the Vibar settings window is easier.
#
#   "cmd+n"                        press a shortcut once
#   { hold = "f18" }               hold it while the key is down
#   { media = "volume_up" }        media key: volume_up, volume_down, mute, play_pause
#   { shell = "open -a Safari" }   run a command
#
# Interface language, "auto" follows the system. Other values are "en" and "zh-CN".
# language = "auto"

[bindings]
knob_ccw   = "up"
knob_cw    = "down"
knob_press = "return"

tab    = "tab"
new    = "cmd+n"
esc    = "esc"
voice  = { hold = "f18" }
action = "cmd+return"
enter  = "return"
